name: Little Genius Cloudflare & Supabase 24/7 CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    name: Typecheck, Unit, Integration, Schema & Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bdwzkdrxrwkulyaiadso.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22+
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check & Production Build
        run: npm run build

      - name: Validate Database Migrations
        run: |
          for migration in migrations/*.sql; do
            sqlite3 -bail /tmp/ci_d1.sqlite < "$migration"
          done
          test -z "$(sqlite3 /tmp/ci_d1.sqlite 'PRAGMA foreign_key_check;')"

      - name: Run Unit, Integration, Security & SSR Render Tests
        run: npm test

      - name: Verify Cloudflare Worker Bundle (Dry-run)
        run: npm run cf:dry-run

  deploy-staging:
    name: Deploy Preview to Cloudflare Staging
    needs: verify-and-test
    if: github.ref == 'refs/heads/staging' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bdwzkdrxrwkulyaiadso.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Deploy Worker & Static Assets to Staging
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env staging

  deploy-production:
    name: Deploy 24/7 Production to Cloudflare
    needs: verify-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bdwzkdrxrwkulyaiadso.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Deploy Worker & Static Assets to Production 24/7
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env production
